name: Remote Cache spec drift

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Compare the vendored spec with turborepo.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - name: Refresh the spec and its types
        working-directory: apps/server
        run: pnpm spec:sync

      - name: Fail when the published spec changed
        run: git diff --exit-code -- apps/server/openapi
