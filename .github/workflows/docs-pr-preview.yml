name: Deploy Docs Preview

on:
  workflow_run:
    workflows: ['CI']
    branches: [master]
    types: [completed]
  pull_request:
    branches: [master]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOCS_CLOUDFLARE_DEPLOYMENT: true

jobs:
  check:
    name: Build and deploy Docs
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build

      - name: Deploy Blume docs
        id: deploy-docs
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/server
          command: pages deploy ../../dist --project-name=cloudflare-turbo-cache-docs

      - name: Comment with deploy link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const commitHash = context.payload.pull_request.head.sha;
            const status = '✅  Deploy successful!'

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `
              # 🌩 Deploying with Cloudflare Pages
              | Name                    | Result |
              | ----------------------- | ------ |
              | **Last commit:**        | \`${commitHash.substring(0, 7)}\` |
              | **Status**:             | ${status} |
              | **Preview URL**:        | ${deploymentUrl} |
              `
            });
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-docs.outputs.deployment-url }}
