name: Deploy to Cloudflare Workers

on:
  repository_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=@turborepo-remote-cache/server

      # Wrangler creates the R2 bucket named in wrangler.jsonc on the first deploy.
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN || 'SECRET' }}
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/server
          secrets: |
            TURBO_TOKEN
          command: deploy
