name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  verify:
    name: Verify
    if: github.event_name != 'schedule' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check generated code
        run: pnpm codegen:check

      - name: Check Worker bundle
        working-directory: apps/api
        run: pnpm exec wrangler deploy --dry-run

      - name: Upload coverage
        uses: coverallsapp/github-action@v2
        with:
          files: apps/api/coverage/clover.xml packages/files-sdk-kv/coverage/clover.xml

  e2e:
    name: End-to-end
    if: github.event_name != 'schedule' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test end to end
        run: pnpm test:e2e

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  # Pull requests get a Worker Preview, linked from a PR comment; master deploys https://turborepo-remote-cache.dev.
  docs-cloudflare:
    name: Docs · Cloudflare Workers
    if: (github.event_name == 'pull_request' && github.event.action != 'closed') || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'docs-preview' || 'docs-cloudflare' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build --filter=@turborepo-remote-cache/docs

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/docs
          command: ${{ github.event_name == 'pull_request' && format('preview --name pr-{0}', github.event.pull_request.number) || 'deploy' }}

      - name: Comment with preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
          COMMIT_URL: ${{ steps.deploy.outputs.preview-deployment-url }}
        with:
          script: |
            const marker = '<!-- docs-preview -->';
            const sha = context.payload.pull_request.head.sha;
            const body = [
              marker,
              '### Docs preview',
              '',
              `- Latest: ${process.env.PREVIEW_URL}`,
              `- Commit ${sha.slice(0, 7)}: ${process.env.COMMIT_URL}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  docs-preview-cleanup:
    name: Docs · Delete preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # A pull request closed before its first docs deploy has no Preview to delete.
      - name: Delete preview
        working-directory: apps/docs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          if ! output=$(pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation 2>&1); then
            echo "$output"
            grep -q 'Preview not found' <<<"$output" || exit 1
          fi

  deploy:
    name: Deploy · Cloudflare Workers
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build --filter=@turborepo-remote-cache/api

      # Wrangler creates the R2 bucket named in wrangler.jsonc on the first deploy.
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN || 'SECRET' }}
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/api
          secrets: |
            TURBO_TOKEN
          command: deploy

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Create bot token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CHANGESETS_RELEASE_APP_ID }}
          private-key: ${{ secrets.CHANGESETS_RELEASE_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      # The bot id is taken from https://api.github.com/users/changesets-release-app[bot]
      - name: Configure Git
        run: |
          git config --global user.name "changesets-release-app[bot]"
          git config --global user.email "152388490+changesets-release-app[bot]@users.noreply.github.com"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Version or tag
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.token.outputs.token }}
          commit-message: 'chore(release): Release latest changesets'
          pr-title: 'chore(release): Release latest changesets'
          create-github-releases: true
          publish-script: pnpm changeset git-tag

  spec-drift:
    name: Spec drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Refresh spec
        run: pnpm spec:sync

      - name: Compare with vendored spec
        run: git diff --exit-code -- packages/spec
