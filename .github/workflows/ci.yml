name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  check:
    name: Check correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Check the generated spec types match the vendored spec
        working-directory: apps/server
        run: |
          pnpm spec:types
          git diff --exit-code -- openapi

      - name: Check the generated Worker types match wrangler.jsonc
        working-directory: apps/server
        run: pnpm exec wrangler types --check

      - name: Check the Worker bundle
        working-directory: apps/server
        run: pnpm exec wrangler deploy --dry-run

      - name: Coveralls Coverage Report
        uses: coverallsapp/github-action@v2
        with:
          files: apps/server/coverage/clover.xml packages/files-sdk-kv/coverage/clover.xml

  e2e-worker:
    name: End to end on Cloudflare Workers (wrangler dev, local R2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=@turborepo-remote-cache/server

      - name: Start the Worker
        working-directory: apps/server
        run: |
          pnpm preview:worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          timeout 60 sh -c 'until curl --silent --fail http://localhost:8787/ping; do sleep 1; done'

      - name: Contract tests
        working-directory: apps/server
        run: pnpm test:contract

      - name: turbo round trip
        working-directory: apps/server
        run: pnpm test:turbo

      - name: Worker log
        if: failure()
        run: cat "$RUNNER_TEMP/worker.log"
