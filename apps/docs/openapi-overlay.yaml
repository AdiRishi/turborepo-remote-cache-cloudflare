overlay: 1.0.0
info:
  title: Turborepo Remote Cache API
  version: 1.0.0
actions:
  - target: $.info
    update:
      description: |
        Full implementation of the official Turborepo Remote Cache v8 specification.

        Base URL: `https://<your-host>/v8`. Authenticate every request with `Authorization: Bearer <TURBO_TOKEN>`. Artifacts are namespaced by the `teamId` or `slug` query parameter (defaulting to `team_default_team` when omitted), and error responses return `{ "code", "message" }` JSON payloads.

        CORS is enabled for `/v8/*` from any origin, so you can test endpoints directly against your deployment from the **Try it** panel by entering your hostname below.
  - target: $.servers
    remove: true
  - target: $
    update:
      servers:
        - url: https://{host}/v8
          description: Your Turborepo Remote Cache server
          variables:
            host:
              default: turborepo-remote-cache.example.workers.dev
              description: Hostname of your deployment
